<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Typer - Admin Panel</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="/assets/bootstrap-5.0.2-dist/css/bootstrap.min.css">
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #a855f7 100%);
            --card-shadow: 0 10px 40px rgba(99, 102, 241, 0.15);
            --hover-shadow: 0 20px 60px rgba(99, 102, 241, 0.25);
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--primary-gradient);
            min-height: 100vh;
        }

        /* Login Section */
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            max-width: 420px;
            width: 100%;
            padding: 48px 40px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .login-card .logo {
            font-size: 3rem;
            text-align: center;
            margin-bottom: 8px;
        }

        .login-card h2 {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            text-align: center;
            margin-bottom: 32px;
        }

        /* Main Content */
        .main-wrapper {
            padding: 24px;
        }

        .header-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            padding: 28px 32px;
            margin-bottom: 24px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .header-card h1 {
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            font-size: 1.75rem;
            margin-bottom: 4px;
        }

        .header-card p {
            color: #64748b;
            margin: 0;
        }

        .content-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            box-shadow: var(--card-shadow);
            padding: 32px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        /* Custom Tabs */
        .nav-tabs-custom {
            border: none;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 6px;
            margin-bottom: 28px;
        }

        .nav-tabs-custom .nav-link {
            border: none;
            border-radius: 8px;
            padding: 12px 28px;
            font-weight: 600;
            color: #64748b;
            transition: all 0.3s ease;
        }

        .nav-tabs-custom .nav-link:hover {
            color: #6366f1;
            background: rgba(99, 102, 241, 0.1);
        }

        .nav-tabs-custom .nav-link.active {
            background: var(--primary-gradient);
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        /* Form Cards */
        .form-card {
            background: linear-gradient(145deg, #f8fafc 0%, #f1f5f9 100%);
            border-radius: 16px;
            padding: 28px;
            margin-bottom: 28px;
            border: 1px solid #e2e8f0;
        }

        .form-card h5 {
            color: #334155;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-card h5::before {
            content: '';
            width: 4px;
            height: 24px;
            background: var(--primary-gradient);
            border-radius: 2px;
        }

        /* Custom Form Controls */
        .form-control, .form-select {
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            padding: 12px 16px;
            font-size: 0.95rem;
            transition: all 0.3s ease;
        }

        .form-control:focus, .form-select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .form-label {
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
        }

        .form-check-input:checked {
            background-color: #6366f1;
            border-color: #6366f1;
        }

        /* Custom Buttons */
        .btn-primary-gradient {
            background: var(--primary-gradient);
            border: none;
            color: white;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .btn-primary-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(99, 102, 241, 0.4);
            color: white;
        }

        .btn-outline-secondary {
            border: 2px solid #e2e8f0;
            color: #64748b;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 10px;
        }

        .btn-outline-secondary:hover {
            background: #f1f5f9;
            border-color: #cbd5e1;
            color: #475569;
        }

        /* Table Styling */
        .table-card {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #e2e8f0;
        }

        .table-card h5 {
            padding: 20px 24px;
            margin: 0;
            background: linear-gradient(145deg, #f8fafc 0%, #f1f5f9 100%);
            font-weight: 700;
            color: #334155;
            border-bottom: 1px solid #e2e8f0;
        }

        .table {
            margin-bottom: 0;
        }

        .table thead {
            background: var(--primary-gradient);
        }

        .table thead th {
            color: white;
            font-weight: 600;
            padding: 16px 20px;
            border: none;
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .table tbody td {
            padding: 16px 20px;
            vertical-align: middle;
            border-color: #f1f5f9;
            color: #475569;
        }

        .table tbody tr:hover {
            background: #fafaff;
        }

        /* Badges */
        .badge-easy {
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .badge-medium {
            background: linear-gradient(135deg, #f59e0b 0%, #fbbf24 100%);
            color: #1f2937;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .badge-hard {
            background: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.75rem;
        }

        .badge-active {
            background: linear-gradient(135deg, #10b981 0%, #34d399 100%);
            color: white;
        }

        .badge-inactive {
            background: linear-gradient(135deg, #64748b 0%, #94a3b8 100%);
            color: white;
        }

        /* Action Buttons */
        .btn-action {
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-edit {
            background: linear-gradient(135deg, #3b82f6 0%, #60a5fa 100%);
            border: none;
            color: white;
        }

        .btn-edit:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
            color: white;
        }

        .btn-delete {
            background: linear-gradient(135deg, #ef4444 0%, #f87171 100%);
            border: none;
            color: white;
        }

        .btn-delete:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(239, 68, 68, 0.4);
            color: white;
        }

        /* Alert Messages */
        .alert-custom {
            border: none;
            border-radius: 12px;
            padding: 16px 20px;
            font-weight: 500;
        }

        .alert-success-custom {
            background: linear-gradient(135deg, rgba(16, 185, 129, 0.1) 0%, rgba(52, 211, 153, 0.1) 100%);
            color: #065f46;
            border-left: 4px solid #10b981;
        }

        .alert-danger-custom {
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.1) 0%, rgba(248, 113, 113, 0.1) 100%);
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        /* Logout Button */
        .btn-logout {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border: none;
            color: white;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 10px;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(239, 68, 68, 0.4);
            color: white;
        }

        /* Responsive Adjustments */
        @media (max-width: 768px) {
            .header-card {
                text-align: center;
            }
            
            .header-card .d-flex {
                flex-direction: column;
                gap: 16px;
            }
            
            .nav-tabs-custom {
                flex-direction: column;
            }
            
            .nav-tabs-custom .nav-link {
                text-align: center;
            }
        }

        /* Hidden utility */
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <!-- Login Section -->
    <div id="loginSection" class="login-wrapper">
        <div class="login-card">
            <div class="logo">🎮</div>
            <h2>Quick Typer Admin</h2>
            
            <div id="loginError" class="alert alert-danger-custom hidden" role="alert"></div>
            
            <form id="loginForm">
                <div class="mb-4">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" placeholder="Enter your username" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" placeholder="Enter your password" required>
                </div>
                <button type="submit" class="btn btn-primary-gradient w-100">
                    Sign In
                </button>
            </form>
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainContent" class="hidden">
        <div class="main-wrapper">
            <div class="container-fluid">
                <!-- Header -->
                <div class="header-card">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <h1>🎮 Quick Typer Admin Panel</h1>
                            <p>Manage stages, phrases, and game content</p>
                        </div>
                        <button class="btn btn-logout" onclick="logout()">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-right me-2" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0v2z"/>
                                <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708l3-3z"/>
                            </svg>
                            Logout
                        </button>
                    </div>
                </div>

                <!-- Content Card -->
                <div class="content-card">
                    <!-- Message Alert -->
                    <div id="message" class="hidden"></div>

                    <!-- Tabs -->
                    <ul class="nav nav-tabs-custom nav-fill" role="tablist">
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" id="stages-tab" data-bs-toggle="tab" data-bs-target="#stagesTab" type="button" role="tab">
                                📦 Stages
                            </button>
                        </li>
                        <li class="nav-item" role="presentation">
                            <button class="nav-link" id="phrases-tab" data-bs-toggle="tab" data-bs-target="#phrasesTab" type="button" role="tab">
                                ✏️ Phrases
                            </button>
                        </li>
                    </ul>

                    <!-- Tab Content -->
                    <div class="tab-content">
                        <!-- Stages Tab -->
                        <div class="tab-pane fade show active" id="stagesTab" role="tabpanel">
                            <!-- Create/Edit Stage Form -->
                            <div class="form-card">
                                <h5 id="stageFormTitle">Create New Stage</h5>
                                <form id="stageForm">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="stageName" class="form-label">Stage Name</label>
                                            <input type="text" class="form-control" id="stageName" placeholder="Enter stage name" required>
                                        </div>
                                        <div class="col-md-6 mb-3">
                                            <label for="stageTheme" class="form-label">Theme</label>
                                            <select class="form-select" id="stageTheme" required>
                                                <option value="">Loading themes...</option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="stageDifficulty" class="form-label">Difficulty</label>
                                            <select class="form-select" id="stageDifficulty" required>
                                                <option value="easy">🟢 Easy</option>
                                                <option value="medium">🟡 Medium</option>
                                                <option value="hard">🔴 Hard</option>
                                            </select>
                                        </div>
                                        <div class="col-md-6 mb-3 d-flex align-items-end">
                                            <div class="form-check">
                                                <input class="form-check-input" type="checkbox" id="stageIsActive" checked>
                                                <label class="form-check-label" for="stageIsActive">
                                                    Active Stage
                                                </label>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-primary-gradient">
                                            Create Stage
                                        </button>
                                        <button type="button" class="btn btn-outline-secondary hidden" onclick="cancelEdit()" id="cancelEditBtn">
                                            Cancel
                                        </button>
                                    </div>
                                </form>
                            </div>

                            <!-- Stages Table -->
                            <div class="table-card">
                                <h5>📋 All Stages</h5>
                                <div class="table-responsive">
                                    <table class="table table-hover" id="stagesTable">
                                        <thead>
                                            <tr>
                                                <th>Name</th>
                                                <th>Theme</th>
                                                <th>Difficulty</th>
                                                <th>Status</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody id="stagesTableBody">
                                            <tr><td colspan="5" class="text-center py-4 text-muted">Loading stages...</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>

                        <!-- Phrases Tab -->
                        <div class="tab-pane fade" id="phrasesTab" role="tabpanel">
                            <!-- Create/Edit Phrase Form -->
                            <div class="form-card">
                                <h5 id="phraseFormTitle">Create New Phrase</h5>
                                <form id="phraseForm">
                                    <div class="row">
                                        <div class="col-md-6 mb-3">
                                            <label for="phraseStageId" class="form-label">Stage</label>
                                            <select class="form-select" id="phraseStageId" required>
                                                <option value="">Loading stages...</option>
                                            </select>
                                        </div>
                                        <div class="col-md-3 mb-3">
                                            <label for="phraseSequence" class="form-label">Sequence Number</label>
                                            <input type="number" class="form-control" id="phraseSequence" min="1" placeholder="1" required>
                                        </div>
                                        <div class="col-md-3 mb-3">
                                            <label for="phraseMultiplier" class="form-label">Base Multiplier</label>
                                            <input type="number" class="form-control" id="phraseMultiplier" step="0.1" min="0.1" value="1.0" required>
                                        </div>
                                    </div>
                                    <div class="mb-3">
                                        <label for="phraseText" class="form-label">Phrase Text</label>
                                        <textarea class="form-control" id="phraseText" rows="3" placeholder="Enter the phrase to type..." required></textarea>
                                    </div>
                                    <div class="d-flex gap-2">
                                        <button type="submit" class="btn btn-primary-gradient">
                                            Create Phrase
                                        </button>
                                        <button type="button" class="btn btn-outline-secondary hidden" onclick="cancelPhraseEdit()" id="cancelPhraseEditBtn">
                                            Cancel
                                        </button>
                                    </div>
                                </form>
                            </div>

                            <!-- Phrases Table -->
                            <div class="table-card">
                                <h5>📋 All Phrases</h5>
                                <div class="p-3 border-bottom bg-light">
                                    <div class="row align-items-center">
                                        <div class="col-md-4">
                                            <label for="filterStageId" class="form-label mb-0 me-2">Filter by Stage:</label>
                                            <select class="form-select" id="filterStageId" onchange="loadPhrases()">
                                                <option value="">All Stages</option>
                                            </select>
                                        </div>
                                    </div>
                                </div>
                                <div class="table-responsive">
                                    <table class="table table-hover" id="phrasesTable">
                                        <thead>
                                            <tr>
                                                <th>Stage</th>
                                                <th>Text</th>
                                                <th>Sequence</th>
                                                <th>Multiplier</th>
                                                <th>Actions</th>
                                            </tr>
                                        </thead>
                                        <tbody id="phrasesTableBody">
                                            <tr><td colspan="5" class="text-center py-4 text-muted">Loading phrases...</td></tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="/assets/bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/app.js"></script>
</body>
</html>
